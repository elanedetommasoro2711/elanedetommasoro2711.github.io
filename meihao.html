<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body {
            font-family: system-ui, sans-serif;
            text-align: center;
            padding-top: 80px;
            font-size: 16px;
            color:#333;
        }
        h3 {
            font-size: 48px;
            color:#222;
        }
        .tip-text {
            font-size: 32px;
            color:#667788;
        }
        .error-text {
            font-size: 42px;
            color:red;
            margin-top:30px;
        }
        .link-box {
            margin-top:24px;
            font-size:24px;
        }
        #manualLink {
            color:#0066cc;
            display:none;
        }
    </style>
</head>
<body>
    <div>
        <h3>正在跳转注册页面，请稍候...</h3>
        <p class="tip-text">如长时间未跳转，请复制链接手动访问</p>
        <p class="link-box"><a id="manualLink">点击手动访问</a></p>
        <p class="error-text" id="errorMsg"></p>
    </div>

<script>
// ======================【配置区域，修改这里】======================
// 多个目标域名，结尾不要加 /
const DOMAIN_LIST = [
    "https://ffss23234fsdf324fsdfsr324.haoliao158.blog",
    "https://67vsfer34tsfsdf43.haoliao158.blog",
    "https://35345324423sfdsdgfdfge5r.haoliao158.shop",
    "https://dsfdsdfsfrwer2324.haoliao158.online"
];
// 无邀请码时默认邀请码，不需要留空 ""
const DEFAULT_INVITE = "";
// =================================================================

// 随机获取域名
function getRandomDomain(){
    const randomIndex = Math.floor(Math.random() * DOMAIN_LIST.length);
    return DOMAIN_LIST[randomIndex];
}

(function(){
    const queryRaw = window.location.search.slice(1);
    let inviteCode = DEFAULT_INVITE;

    if(queryRaw){
        // 关键修复：截取最后一段 ?invite=xxx
        const realParamStr = queryRaw.split("?").pop();
        const innerParams = new URLSearchParams(realParamStr);
        inviteCode = innerParams.get('invite') || DEFAULT_INVITE;
    }

    const errorDom = document.getElementById("errorMsg");
    const linkDom = document.getElementById('manualLink');

    if(!inviteCode){
        errorDom.innerText = "未识别到邀请码！";
        return;
    }

    const randomDomain = getRandomDomain();
    const targetUrl = `${randomDomain}/register.php?invite=${inviteCode}`;

    // 显示手动跳转链接
    linkDom.href = targetUrl;
    linkDom.style.display = "block";
    linkDom.innerText = targetUrl;

    // 原生跳转，微信/浏览器不易拦截
    window.location.href = targetUrl;
})();
</script>
</body>
</html>
