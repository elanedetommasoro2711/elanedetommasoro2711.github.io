<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f7f8fc 0%, #eef2ff 100%);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .card {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* Loading旋转动画 */
        .loader {
            width: 56px;
            height: 56px;
            border: 4px solid #e6edff;
            border-top-color: #3671e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to {transform: rotate(360deg);}
        }
        h2 {
            font-size: 24px;
            color: #1d2939;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 15px;
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .btn-link {
            display: inline-block;
            padding: 14px 36px;
            background-color: #3671e9;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.25s ease;
        }
        .btn-link:hover {
            background-color: #2859c4;
        }
        .tip-small {
            margin-top: 16px;
            font-size: 13px;
            color: #98a2b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h2>正在分配线路，请稍候</h2>
        <p class="desc">系统随机选择可用通道，即将进入目标页面</p>
        <a href="" class="btn-link" id="manualLink" style="display:none;">手动点击跳转</a>
        <p class="tip-small">长时间未跳转请点击上方按钮</p>
    </div>

<script>
// =====================【配置区域，修改这里】=====================
// 填入所有随机跳转目标地址（完整链接！）
const URL_LIST = [
    "https://35345324423sfdsdgfdfge5r.haoliao158.blog",
    "https://35345324423sfdsdgfdfge5r.haoliao158.blog",
    "https://35345324423sfdsdgfdfge5r.haoliao158.shop",
    "https://35345324423sfdsdgfdfge5r.haoliao158.online"
    // 可以继续添加上百条，格式保持一致
];
// ===============================================================

// 随机选取链接
function getRandomUrl() {
    const randomIndex = Math.floor(Math.random() * URL_LIST.length);
    return URL_LIST[randomIndex];
}

(function(){
    const targetUrl = getRandomUrl();
    const linkDom = document.getElementById('manualLink');

    // 设置手动跳转链接
    linkDom.href = targetUrl;
    linkDom.style.display = "inline-block";

    // 自动跳转
    window.location.href = targetUrl;
})();
</script>
</body>
</html>
